<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Hidalgo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script>
        let path = window.location.pathname;
        if (path.endsWith('/') && path !== '/') path = path.slice(0, -1);
        const segments = path.split('/').filter(Boolean);
        const currentPage = segments.length ? segments[segments.length - 1] : 'index';
        document.documentElement.dataset.page = currentPage;
    </script>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo" aria-label="Inicio">
                <video autoplay loop muted playsinline preload="metadata">
                    <source src="/videos/Pijus_isotipo.webm" type="video/webm">
                </video>
            </a>
                <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>

            <div class="header-right">
                <nav aria-label="Navegación principal">
                    <a href="/">PROYECTOS</a>
                    <a href="/logofolio/">LOGOFOLIO</a>
                    <a href="/sobremi/">SOBRE MÍ</a>
                    <a href="/contacto/">CONTACTO</a>
                </nav>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/πjus" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                        <img src="/images/linkedin.svg" alt="LinkedIn">
                    </a>
                    <a href="https://www.behance.net/Pijuss" target="_blank" rel="noopener noreferrer" aria-label="Behance">
                        <img src="/images/behance.svg" alt="Behance">
                    </a>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section id="contact">
            <div class="container">
                <form class="contact-form" id="contactForm" action="https://formspree.io/f/mppaqkve" method="POST">
                    <div class="form-field">
                        <input type="text" id="name" name="name" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-field">
                        <input type="email" id="email" name="email" placeholder="Tu correo" required>
                    </div>
                    <div class="form-field">
                        <textarea id="message" name="message" rows="6" placeholder="Tu mensaje" required></textarea>
                    </div>
                    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                    <button type="submit" class="btn-submit">ENVIAR</button>
                    <p class="form-status" id="formStatus"></p>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>πjus 2026</p>
    </footer>
    <script src="/script.js"></script>
</body>
</html>
