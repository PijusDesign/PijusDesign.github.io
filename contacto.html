    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo" aria-label="Inicio">
                <video autoplay loop muted playsinline preload="metadata">
                    <source src="videos/Pijus_isotipo.webm" type="video/webm">
                </video>
            </a>
            <div class="header-right">
                <nav aria-label="Navegación principal">
                    <a href="index.html">PROYECTOS</a>
                    <a href="logofolio.html">LOGOFOLIO</a>
                    <a href="index.html#about">SOBRE MÍ</a>
                    <a href="contacto.html">CONTACTO</a>
                </nav>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/πjus" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <img src="images/linkedin.svg" alt="LinkedIn">
                </a>
                <a href="https://www.behance.net/Pijuss" target="_blank" rel="noopener noreferrer" aria-label="Behance">
                    <img src="images/behance.svg" alt="Behance">
                </a>
            </div>
            </div>
        </div>
    </header>
<main>
    <section id="contact">
        <div class="container">
            <form class="contact-form" id="contactForm" action="https://formspree.io/f/mppaqkve" method="POST">
                <div class="form-field">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-field">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="6" placeholder="Cuéntame en qué puedo ayudarte..." required></textarea>
                </div>
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                <button type="submit" class="btn-submit">ENVIAR</button>
                <p class="form-status" id="formStatus"></p>
            </form>
        </div>
    </section>
</main>
<footer>
        <p>pijus 2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
